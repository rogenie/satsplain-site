<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
  <title>Four checks before a first crypto purchase</title>
  <rect width="800" height="450" rx="28" fill="#FAF8F3"/>
  <rect width="800" height="10" fill="#2A9D8F"/>
  <text x="40" y="64" fill="#14213D" font-family="Georgia, serif" font-size="32">Slow down before the button</text>
  <text x="40" y="98" fill="#475569" font-family="Georgia, serif" font-size="18">Check the company, the site, the lock, and the fee.</text>
  <g font-family="Georgia, serif">
    <g>
      <rect x="40" y="140" width="165" height="230" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
      <circle cx="122" cy="188" r="22" fill="#F2A541" stroke="#14213D" stroke-width="2"/>
      <text x="122" y="195" text-anchor="middle" fill="#14213D" font-size="20">1</text>
      <text x="58" y="240" fill="#14213D" font-size="18">The company</text>
      <text x="58" y="270" fill="#475569" font-size="15">Look it up on</text>
      <text x="58" y="292" fill="#475569" font-size="15">a public register.</text>
    </g>
    <g>
      <rect x="225" y="140" width="165" height="230" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
      <circle cx="307" cy="188" r="22" fill="#F2A541" stroke="#14213D" stroke-width="2"/>
      <text x="307" y="195" text-anchor="middle" fill="#14213D" font-size="20">2</text>
      <text x="243" y="240" fill="#14213D" font-size="18">The website</text>
      <text x="243" y="270" fill="#475569" font-size="15">Type the address.</text>
      <text x="243" y="292" fill="#475569" font-size="15">Skip the texted link.</text>
    </g>
    <g>
      <rect x="410" y="140" width="165" height="230" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
      <circle cx="492" cy="188" r="22" fill="#F2A541" stroke="#14213D" stroke-width="2"/>
      <text x="492" y="195" text-anchor="middle" fill="#14213D" font-size="20">3</text>
      <text x="428" y="240" fill="#14213D" font-size="18">The lock</text>
      <text x="428" y="270" fill="#475569" font-size="15">Turn on a second</text>
      <text x="428" y="292" fill="#475569" font-size="15">sign-in check.</text>
    </g>
    <g>
      <rect x="595" y="140" width="165" height="230" rx="18" fill="#FFF6E8" stroke="#14213D" stroke-width="2"/>
      <circle cx="677" cy="188" r="22" fill="#F2A541" stroke="#14213D" stroke-width="2"/>
      <text x="677" y="195" text-anchor="middle" fill="#14213D" font-size="20">4</text>
      <text x="613" y="240" fill="#14213D" font-size="18">The fee</text>
      <text x="613" y="270" fill="#475569" font-size="15">Read the total</text>
      <text x="613" y="292" fill="#475569" font-size="15">before you confirm.</text>
    </g>
  </g>
</svg>
