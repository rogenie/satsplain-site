<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
  <title>A bitcoin record is a chain of blocks, opened with a private key</title>
  <rect width="800" height="450" rx="28" fill="#FAF8F3"/>
  <rect width="800" height="10" fill="#F2A541"/>
  <text x="40" y="64" fill="#14213D" font-family="Georgia, serif" font-size="32">What you hold is a key</text>
  <text x="40" y="98" fill="#475569" font-family="Georgia, serif" font-size="18">The coin is a record. The secret is what spends it.</text>
  <g>
    <rect x="40" y="140" width="150" height="110" rx="16" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="56" y="176" fill="#14213D" font-family="Georgia, serif" font-size="18">Block 1</text>
    <text x="56" y="204" fill="#475569" font-family="Georgia, serif" font-size="14">Earlier payments</text>
    <text x="56" y="228" fill="#1F756A" font-family="Georgia, serif" font-size="14">hash 8f3a</text>
  </g>
  <path d="M198 195 h36" stroke="#1F756A" stroke-width="3"/>
  <path d="M226 187 l12 8 -12 8" fill="#1F756A"/>
  <g>
    <rect x="250" y="140" width="150" height="110" rx="16" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="266" y="176" fill="#14213D" font-family="Georgia, serif" font-size="18">Block 2</text>
    <text x="266" y="204" fill="#475569" font-family="Georgia, serif" font-size="14">Points at block 1</text>
    <text x="266" y="228" fill="#1F756A" font-family="Georgia, serif" font-size="14">hash 1c90</text>
  </g>
  <path d="M408 195 h36" stroke="#1F756A" stroke-width="3"/>
  <path d="M436 187 l12 8 -12 8" fill="#1F756A"/>
  <g>
    <rect x="460" y="140" width="150" height="110" rx="16" fill="#FFF6E8" stroke="#14213D" stroke-width="2"/>
    <text x="476" y="176" fill="#14213D" font-family="Georgia, serif" font-size="18">Block 3</text>
    <text x="476" y="204" fill="#475569" font-family="Georgia, serif" font-size="14">Your payment</text>
    <text x="476" y="228" fill="#1F756A" font-family="Georgia, serif" font-size="14">hash 44b2</text>
  </g>
  <g>
    <circle cx="120" cy="340" r="36" fill="#F2A541" stroke="#14213D" stroke-width="2"/>
    <circle cx="120" cy="340" r="16" fill="#14213D"/>
    <text x="176" y="332" fill="#14213D" font-family="Georgia, serif" font-size="20">Private key</text>
    <text x="176" y="358" fill="#475569" font-family="Georgia, serif" font-size="16">Signs the payment. Cannot be reset.</text>
  </g>
</svg>
