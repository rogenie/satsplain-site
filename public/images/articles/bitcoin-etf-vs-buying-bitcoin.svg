<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
  <title>Fund shares versus wallet keys</title>
  <desc>Two side-by-side cards: brokerage shares of a bitcoin fund on the left, and a wallet holding keys on the right, with a question mark between them.</desc>
  <rect width="800" height="450" rx="28" fill="#FAF8F3"/>
  <rect width="800" height="10" fill="#2A9D8F"/>
  <text x="40" y="62" fill="#14213D" font-family="Georgia, serif" font-size="32">Shares, or keys?</text>
  <text x="40" y="96" fill="#475569" font-family="Georgia, serif" font-size="17">A bitcoin fund and a bitcoin wallet are different things.</text>
  <g>
    <rect x="40" y="130" width="300" height="240" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <rect x="40" y="130" width="10" height="240" rx="4" fill="#F2A541"/>
    <text x="70" y="174" fill="#14213D" font-family="Georgia, serif" font-size="22">Fund shares</text>
    <text x="70" y="214" fill="#0F172A" font-family="Georgia, serif" font-size="16">You hold shares in a</text>
    <text x="70" y="240" fill="#0F172A" font-family="Georgia, serif" font-size="16">brokerage account.</text>
    <text x="70" y="276" fill="#0F172A" font-family="Georgia, serif" font-size="16">A custodian holds the</text>
    <text x="70" y="302" fill="#0F172A" font-family="Georgia, serif" font-size="16">keys to the bitcoin.</text>
    <text x="70" y="338" fill="#475569" font-family="Georgia, serif" font-size="15">You do not own the coins.</text>
  </g>
  <circle cx="400" cy="250" r="28" fill="#F2A541" stroke="#14213D" stroke-width="2.5"/>
  <text x="391" y="260" fill="#14213D" font-family="Georgia, serif" font-size="28">?</text>
  <g>
    <rect x="460" y="130" width="300" height="240" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <rect x="460" y="130" width="10" height="240" rx="4" fill="#2A9D8F"/>
    <text x="490" y="174" fill="#14213D" font-family="Georgia, serif" font-size="22">Buying bitcoin</text>
    <text x="490" y="214" fill="#0F172A" font-family="Georgia, serif" font-size="16">You hold the wallet keys,</text>
    <text x="490" y="240" fill="#0F172A" font-family="Georgia, serif" font-size="16">or a company does.</text>
    <text x="490" y="276" fill="#0F172A" font-family="Georgia, serif" font-size="16">Self-custody means a</text>
    <text x="490" y="302" fill="#0F172A" font-family="Georgia, serif" font-size="16">seed phrase is the backup.</text>
    <text x="490" y="338" fill="#475569" font-family="Georgia, serif" font-size="15">You can send the coins.</text>
  </g>
  <text x="40" y="418" fill="#475569" font-family="Georgia, serif" font-size="15">The SEC describes both. This page does not pick one for you.</text>
</svg>
