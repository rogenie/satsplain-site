    <rect x="430" y="306" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="444" y="342" fill="#475569" font-size="16">12.</text>
    <rect x="472" y="332" width="58" height="6" rx="3" fill="#CBD5E1"/>
