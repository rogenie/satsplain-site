<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
  <title>Twelve secret words and the key they rebuild</title>
  <desc>A grid of twelve numbered word slots, left blank on purpose, with an arrow to a key. The words can rebuild the wallet's private keys.</desc>
  <rect width="800" height="450" rx="28" fill="#FAF8F3"/>
  <rect width="800" height="10" fill="#2A9D8F"/>
  <text x="40" y="64" fill="#14213D" font-family="Georgia, serif" font-size="32">Twelve words. One master key.</text>
  <text x="40" y="98" fill="#475569" font-family="Georgia, serif" font-size="18">Whoever holds the words can rebuild the wallet.</text>
  <g font-family="Georgia, serif">
    <rect x="40" y="150" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="54" y="186" fill="#475569" font-size="16">1.</text>
    <rect x="82" y="176" width="58" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="170" y="150" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="184" y="186" fill="#475569" font-size="16">2.</text>
    <rect x="212" y="176" width="58" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="300" y="150" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="314" y="186" fill="#475569" font-size="16">3.</text>
    <rect x="342" y="176" width="58" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="430" y="150" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="444" y="186" fill="#475569" font-size="16">4.</text>
    <rect x="472" y="176" width="58" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="40" y="228" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="54" y="264" fill="#475569" font-size="16">5.</text>
    <rect x="82" y="254" width="58" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="170" y="228" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="184" y="264" fill="#475569" font-size="16">6.</text>
    <rect x="212" y="254" width="58" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="300" y="228" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="314" y="264" fill="#475569" font-size="16">7.</text>
    <rect x="342" y="254" width="58" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="430" y="228" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="444" y="264" fill="#475569" font-size="16">8.</text>
    <rect x="472" y="254" width="58" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="40" y="306" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="54" y="342" fill="#475569" font-size="16">9.</text>
    <rect x="82" y="332" width="58" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="170" y="306" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="184" y="342" fill="#475569" font-size="16">10.</text>
    <rect x="212" y="332" width="58" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="300" y="306" width="116" height="58" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <text x="314" y="342" fill="#475569" font-size="16">11.</text>
