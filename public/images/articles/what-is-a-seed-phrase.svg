  <path d="M570 266 h70" stroke="#14213D" stroke-width="3" fill="none"/>
  <path d="M632 256 l12 10 l-12 10" stroke="#14213D" stroke-width="3" fill="none"/>
  <circle cx="690" cy="266" r="34" fill="#F2A541" stroke="#14213D" stroke-width="3"/>
