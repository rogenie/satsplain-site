<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
  <title>A Form 1099-DA with an empty cost basis box</title>
  <desc>A simplified tax form labeled 1099-DA. The proceeds box shows a filled line. The cost basis box is empty and highlighted with a note that says blank is not zero.</desc>
  <rect width="800" height="450" rx="28" fill="#FAF8F3"/>
  <rect width="800" height="10" fill="#2A9D8F"/>
  <text x="40" y="64" fill="#14213D" font-family="Georgia, serif" font-size="32">Form 1099-DA, in plain English</text>
  <text x="40" y="98" fill="#475569" font-family="Georgia, serif" font-size="18">What a broker tells you and the IRS about a crypto sale.</text>
  <g font-family="Georgia, serif">
    <rect x="40" y="128" width="470" height="282" rx="16" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
    <rect x="40" y="128" width="470" height="44" rx="16" fill="#14213D"/>
    <rect x="40" y="152" width="470" height="20" fill="#14213D"/>
    <text x="60" y="158" fill="#FAF8F3" font-size="18">1099-DA  Digital Asset Proceeds</text>
    <rect x="60" y="190" width="200" height="56" rx="8" fill="#FAF8F3" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="210" fill="#475569" font-size="13">1b Name of digital asset</text>
    <rect x="72" y="224" width="120" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="290" y="190" width="200" height="56" rx="8" fill="#FAF8F3" stroke="#475569" stroke-width="1.5"/>
    <text x="302" y="210" fill="#475569" font-size="13">1e Date sold</text>
    <rect x="302" y="224" width="90" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="60" y="262" width="200" height="56" rx="8" fill="#FAF8F3" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="282" fill="#475569" font-size="13">1f Proceeds</text>
    <rect x="72" y="296" width="140" height="6" rx="3" fill="#2A9D8F"/>
    <rect x="290" y="262" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#F2A541" stroke-width="4"/>
    <text x="302" y="282" fill="#14213D" font-size="13">1g Cost or other basis</text>
    <rect x="60" y="334" width="430" height="56" rx="8" fill="#FAF8F3" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="356" fill="#475569" font-size="13">9 Check if noncovered security</text>
    <rect x="72" y="366" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
    <path d="M75 374 l4 5 l7 -9" stroke="#14213D" stroke-width="2" fill="none"/>
  </g>
  <path d="M496 290 h74" stroke="#14213D" stroke-width="3" fill="none"/>
  <path d="M562 280 l12 10 l-12 10" stroke="#14213D" stroke-width="3" fill="none"/>
  <rect x="588" y="230" width="176" height="120" rx="16" fill="#F2A541" stroke="#14213D" stroke-width="2"/>
  <text x="604" y="272" fill="#14213D" font-family="Georgia, serif" font-size="24">Blank is</text>
  <text x="604" y="304" fill="#14213D" font-family="Georgia, serif" font-size="24">not zero.</text>
  <text x="604" y="332" fill="#14213D" font-family="Georgia, serif" font-size="14">Your records fill it.</text>
  <text x="40" y="436" fill="#475569" font-family="Georgia, serif" font-size="15">Simplified drawing based on the 2026 IRS form. Not every box is shown.</text>
</svg>
