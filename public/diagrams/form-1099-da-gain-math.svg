<svg xmlns="http://www.w3.org/2000/svg" width="440" height="760" viewBox="0 0 440 760" role="img">
  <title>Why the basis box matters: proceeds minus basis equals gain or loss</title>
  <desc>Two stacked equations. With your real basis: proceeds minus basis gives the actual gain or loss. With basis left at zero: proceeds minus zero makes the whole sale look like gain.</desc>
  <rect width="440" height="760" rx="28" fill="#FAF8F3"/>
  <rect width="440" height="8" fill="#2A9D8F"/>
  <text x="32" y="52" fill="#14213D" font-family="Georgia, serif" font-size="26">The math the form feeds</text>
  <text x="32" y="80" fill="#475569" font-family="Georgia, serif" font-size="15">Gain or loss = what you got minus your basis.</text>
  <g font-family="Georgia, serif">
    <rect x="28" y="108" width="384" height="250" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
    <rect x="28" y="108" width="10" height="250" rx="4" fill="#2A9D8F"/>
    <text x="56" y="148" fill="#14213D" font-size="20">With your real basis</text>
    <rect x="56" y="170" width="150" height="48" rx="10" fill="#FAF8F3" stroke="#475569"/>
    <text x="70" y="200" fill="#0F172A" font-size="16">Proceeds</text>
    <text x="216" y="202" fill="#14213D" font-size="22">−</text>
    <rect x="240" y="170" width="150" height="48" rx="10" fill="#FAF8F3" stroke="#475569"/>
    <text x="254" y="200" fill="#0F172A" font-size="16">What you paid</text>
    <path d="M220 232 v26" stroke="#14213D" stroke-width="2.5"/><path d="M210 250 l10 12 l10 -12" stroke="#14213D" stroke-width="2.5" fill="none"/>
    <rect x="56" y="272" width="334" height="56" rx="10" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/>
    <text x="72" y="306" fill="#0F172A" font-size="17">Your actual gain or loss</text>
  </g>
  <g font-family="Georgia, serif">
    <rect x="28" y="390" width="384" height="250" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
    <rect x="28" y="390" width="10" height="250" rx="4" fill="#C2410C"/>
    <text x="56" y="430" fill="#14213D" font-size="20">With basis left at zero</text>
    <rect x="56" y="452" width="150" height="48" rx="10" fill="#FAF8F3" stroke="#475569"/>
    <text x="70" y="482" fill="#0F172A" font-size="16">Proceeds</text>
    <text x="216" y="484" fill="#14213D" font-size="22">−</text>
    <rect x="240" y="452" width="150" height="48" rx="10" fill="#FAF8F3" stroke="#475569"/>
    <text x="254" y="482" fill="#0F172A" font-size="16">0</text>
    <path d="M220 514 v26" stroke="#14213D" stroke-width="2.5"/><path d="M210 532 l10 12 l10 -12" stroke="#14213D" stroke-width="2.5" fill="none"/>
    <rect x="56" y="554" width="334" height="56" rx="10" fill="#FFFFFF" stroke="#C2410C" stroke-width="3"/>
    <text x="72" y="588" fill="#0F172A" font-size="17">The whole sale looks like gain</text>
  </g>
  <text x="32" y="690" fill="#475569" font-family="Georgia, serif" font-size="15">If box 1g is blank, the IRS form says to</text>
  <text x="32" y="714" fill="#475569" font-family="Georgia, serif" font-size="15">work out basis from your own records.</text>
</svg>
