<svg xmlns="http://www.w3.org/2000/svg" width="440" height="820" viewBox="0 0 440 820" role="img">
  <title>From seed phrase to private keys to the blockchain</title>
  <desc>The seed phrase rebuilds the wallet's private keys. The keys authorize transfers. The crypto itself is recorded on the blockchain, not inside the wallet.</desc>
  <rect width="440" height="820" rx="28" fill="#FAF8F3"/>
  <rect width="440" height="8" fill="#2A9D8F"/>
  <text x="32" y="52" fill="#14213D" font-family="Georgia, serif" font-size="26">What the words unlock</text>
  <text x="32" y="80" fill="#475569" font-family="Georgia, serif" font-size="15">The wallet holds keys. The coins sit on the ledger.</text>
  <g>
    <rect x="28" y="108" width="384" height="160" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
    <rect x="28" y="108" width="10" height="160" rx="4" fill="#F2A541"/>
    <text x="56" y="148" fill="#14213D" font-family="Georgia, serif" font-size="22">1. Seed phrase</text>
    <text x="56" y="182" fill="#0F172A" font-family="Georgia, serif" font-size="16">Usually 12 or 24 words.</text>
    <text x="56" y="208" fill="#0F172A" font-family="Georgia, serif" font-size="16">Picked at random from a fixed</text>
    <text x="56" y="234" fill="#0F172A" font-family="Georgia, serif" font-size="16">list of 2,048 words.</text>
  </g>
  <path d="M220 276 v30" stroke="#14213D" stroke-width="2.5"/><path d="M210 296 l10 12 l10 -12" stroke="#14213D" stroke-width="2.5" fill="none"/>
  <g>
    <rect x="28" y="316" width="384" height="160" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
    <rect x="28" y="316" width="10" height="160" rx="4" fill="#2A9D8F"/>
    <text x="56" y="356" fill="#14213D" font-family="Georgia, serif" font-size="22">2. Private keys</text>
    <text x="56" y="390" fill="#0F172A" font-family="Georgia, serif" font-size="16">Rebuilt from the words.</text>
    <text x="56" y="416" fill="#0F172A" font-family="Georgia, serif" font-size="16">They authorize a transfer.</text>
    <text x="56" y="442" fill="#0F172A" font-family="Georgia, serif" font-size="16">Lose them, lose access.</text>
  </g>
  <path d="M220 484 v30" stroke="#14213D" stroke-width="2.5"/><path d="M210 504 l10 12 l10 -12" stroke="#14213D" stroke-width="2.5" fill="none"/>
  <g>
    <rect x="28" y="524" width="384" height="160" rx="18" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
    <rect x="28" y="524" width="10" height="160" rx="4" fill="#2A9D8F"/>
    <text x="56" y="564" fill="#14213D" font-family="Georgia, serif" font-size="22">3. The blockchain</text>
    <text x="56" y="598" fill="#0F172A" font-family="Georgia, serif" font-size="16">The public record of who</text>
    <text x="56" y="624" fill="#0F172A" font-family="Georgia, serif" font-size="16">controls which coins.</text>
    <text x="56" y="650" fill="#0F172A" font-family="Georgia, serif" font-size="16">The wallet does not store coins.</text>
  </g>
  <text x="32" y="740" fill="#475569" font-family="Georgia, serif" font-size="15">Anyone with step 1 can recreate step 2</text>
  <text x="32" y="764" fill="#475569" font-family="Georgia, serif" font-size="15">on their own device and move the crypto.</text>
</svg>
