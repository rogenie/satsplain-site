<svg xmlns="http://www.w3.org/2000/svg" width="440" height="760" viewBox="0 0 440 760" role="img">
  <title>Who is allowed to ask for your seed phrase</title>
  <desc>A list of people who might ask for the words, including support staff, police, a government agency and a recovery service, each marked no. Only you should ever see the words.</desc>
  <rect width="440" height="760" rx="28" fill="#FAF8F3"/>
  <rect width="440" height="8" fill="#C2410C"/>
  <text x="32" y="52" fill="#14213D" font-family="Georgia, serif" font-size="26">Who may ask for the words?</text>
  <text x="32" y="80" fill="#475569" font-family="Georgia, serif" font-size="15">Short answer: nobody. Here is the list.</text>
  <rect x="28" y="108" width="384" height="66" rx="14" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
  <text x="52" y="148" fill="#0F172A" font-family="Georgia, serif" font-size="18">Wallet or app support</text>
  <circle cx="370" cy="141" r="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.5"/>
  <path d="M362 133 l16 16 M378 133 l-16 16" stroke="#C2410C" stroke-width="3"/>
  <rect x="28" y="190" width="384" height="66" rx="14" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
  <text x="52" y="230" fill="#0F172A" font-family="Georgia, serif" font-size="18">A bank</text>
  <circle cx="370" cy="223" r="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.5"/>
  <path d="M362 215 l16 16 M378 215 l-16 16" stroke="#C2410C" stroke-width="3"/>
  <rect x="28" y="272" width="384" height="66" rx="14" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
  <text x="52" y="312" fill="#0F172A" font-family="Georgia, serif" font-size="18">Police or a government agency</text>
  <circle cx="370" cy="305" r="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.5"/>
  <path d="M362 297 l16 16 M378 297 l-16 16" stroke="#C2410C" stroke-width="3"/>
  <rect x="28" y="354" width="384" height="66" rx="14" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
  <text x="52" y="394" fill="#0F172A" font-family="Georgia, serif" font-size="18">A crypto regulator</text>
  <circle cx="370" cy="387" r="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.5"/>
  <path d="M362 379 l16 16 M378 379 l-16 16" stroke="#C2410C" stroke-width="3"/>
  <rect x="28" y="436" width="384" height="66" rx="14" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
  <text x="52" y="476" fill="#0F172A" font-family="Georgia, serif" font-size="18">A recovery service</text>
  <circle cx="370" cy="469" r="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.5"/>
  <path d="M362 461 l16 16 M378 461 l-16 16" stroke="#C2410C" stroke-width="3"/>
  <rect x="28" y="518" width="384" height="66" rx="14" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
  <text x="52" y="558" fill="#0F172A" font-family="Georgia, serif" font-size="18">A friend you met online</text>
  <circle cx="370" cy="551" r="18" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.5"/>
  <path d="M362 543 l16 16 M378 543 l-16 16" stroke="#C2410C" stroke-width="3"/>
  <rect x="28" y="610" width="384" height="104" rx="14" fill="#14213D"/>
  <text x="52" y="650" fill="#FAF8F3" font-family="Georgia, serif" font-size="19">If someone asks, stop.</text>
  <text x="52" y="682" fill="#FAF8F3" font-family="Georgia, serif" font-size="15">End the contact. Find the company's real</text>
  <text x="52" y="702" fill="#FAF8F3" font-family="Georgia, serif" font-size="15">number yourself before you say anything.</text>
</svg>
